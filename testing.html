<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Voice Wishlist</title>
</head>
<body>
  <h2>🎤 Voice to Wishlist</h2>
  <button id="startBtn">Start Recording</button>
  <button id="stopBtn">Stop & Upload</button>

  <p><b>Recognized Text:</b> <span id="recognized"></span></p>
  <pre id="llmResponse"></pre>

  <div id="confirmBox" style="display:none;">
    <p>✅ Are you sure you want to update your wishlist?</p>
    <button id="confirmBtn">Yes</button>
    <button id="cancelBtn">No</button>
  </div>

  <h3>🛒 Your Wishlist</h3>
  <ul id="wishlist"></ul>

  <h3>✨ Recommended for You</h3>
  <ul id="recommendations"></ul>

  <script>
    let mediaRecorder;
    let audioChunks = [];
    let lastLLMResponse = null;
    const username = "aseem";  // <- fix username for now

    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const recognized = document.getElementById("recognized");
    const llmResponseBox = document.getElementById("llmResponse");
    const confirmBox = document.getElementById("confirmBox");
    const confirmBtn = document.getElementById("confirmBtn");
    const cancelBtn = document.getElementById("cancelBtn");
    const wishlist = document.getElementById("wishlist");
    const recommendations = document.getElementById("recommendations");

    // 🔹 Function to fetch wishlist
    async function loadWishlist() {
      let res = await fetch(`http://127.0.0.1:8000/wishlist/${username}`);
      let data = await res.json();
      wishlist.innerHTML = ""; // clear old list
      if (data.wishlist) {
        data.wishlist.forEach(item => {
          let li = document.createElement("li");
          li.textContent = `${item.quantity} × ${item.product} (${item.category})`;
          wishlist.appendChild(li);
        });
      }
    }

    // 🔹 Function to fetch recommendations
    async function loadRecommendations() {
      let res = await fetch(`http://127.0.0.1:8000/recommendations/${username}`);
      let data = await res.json();
      recommendations.innerHTML = ""; // clear old list
      if (data.recommendations) {
        data.recommendations.forEach(item => {
          let li = document.createElement("li");
          li.textContent = `${item.product} (${item.category}) - ₹${item.price} | Stock: ${item.quantity}`;
          recommendations.appendChild(li);
        });
      } else {
        recommendations.innerHTML = "<li>No recommendations found</li>";
      }
    }

    // Load wishlist + recommendations on page load
    window.onload = async () => {
      await loadWishlist();
      await loadRecommendations();
    };

    startBtn.onclick = async () => {
      let stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];
      mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
      mediaRecorder.start();
    };

    stopBtn.onclick = () => {
      mediaRecorder.stop();
      mediaRecorder.onstop = async () => {
        let blob = new Blob(audioChunks, { type: "audio/webm" });
        let formData = new FormData();
        formData.append("file", blob, "voice.webm");

        let response = await fetch("http://127.0.0.1:8000/add_to_wishlist", {
          method: "POST",
          body: formData
        });
        let result = await response.json();

        if (result.recognized_text) {
          recognized.textContent = result.recognized_text;
          llmResponseBox.textContent = JSON.stringify(result.llm_response, null, 2);
          lastLLMResponse = result.llm_response;
          confirmBox.style.display = "block";
        } else {
          recognized.textContent = "Error: " + result.error;
        }
      };
    };

    confirmBtn.onclick = async () => {
      let response = await fetch(`http://127.0.0.1:8000/update_wishlist/${username}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(lastLLMResponse)
      });
      let result = await response.json();

      if (result.message) {
        alert("✅ " + result.message);
        confirmBox.style.display = "none";
        await loadWishlist();       // refresh wishlist
        await loadRecommendations(); // refresh recommendations
      } else {
        alert("❌ " + result.error);
      }
    };

    cancelBtn.onclick = () => {
      confirmBox.style.display = "none";
      alert("❌ Cancelled by user");
    };
  </script>
</body>
</html>
